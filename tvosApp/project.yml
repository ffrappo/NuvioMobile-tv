name: NuvioTV
options:
  deploymentTarget:
    tvOS: "18.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

packages:
  MPVKit:
    path: ../MPVKit

settings:
  base:
    SWIFT_VERSION: "5.0"
    TVOS_BUNDLE_IDENTIFIER: com.nuvio.app.tvos.dev
    TVOS_TOP_SHELF_BUNDLE_IDENTIFIER: com.nuvio.app.tvos.dev.topshelf
    TVOS_TEST_BUNDLE_IDENTIFIER: com.nuvio.app.tvos.dev.tests
    TVOS_UI_TEST_BUNDLE_IDENTIFIER: com.nuvio.app.tvos.dev.uitests

targets:
  NuvioTV:
    type: application
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: MPVKit
        product: MPVKit-GPL
      - target: NuvioTopShelf
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(TVOS_BUNDLE_IDENTIFIER)"
        PRODUCT_NAME: Nuvio
        PRODUCT_MODULE_NAME: NuvioTV
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Nuvio
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.entertainment
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.nuvio.app.tvos.details
            CFBundleURLSchemes:
              - nuvio

  NuvioTopShelf:
    type: tv-app-extension
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: TopShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(TVOS_TOP_SHELF_BUNDLE_IDENTIFIER)"
        PRODUCT_NAME: NuvioTopShelf
        PRODUCT_MODULE_NAME: NuvioTopShelf
        SKIP_INSTALL: YES
    info:
      path: Generated/TopShelf-Info.plist
      properties:
        CFBundleDisplayName: Nuvio Top Shelf
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).NuvioTopShelfProvider"

schemes:
  NuvioTV:
    build:
      targets:
        NuvioTV: all
        NuvioTopShelf: all
    run:
      config: Debug
